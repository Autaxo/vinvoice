- list: VEHICLE-ROLE 1.0 (vehicle.roleCode)
  tokens:
    - supply
    - trade-in
    - service
    - rental
    - lease
    - agency
    - transport
    - other
  source: "Registry-owned; there is no EU list. The rental/lease boundary of 30 days follows Directive
    2006/112/EC Art. 56(3) as a boundary only; the tokens state no VAT treatment. Informative
    alignment: schema.org businessFunction."
- list: VEHICLE-CONDITION 1.0 (vehicle.conditionCode), partition without other
  tokens:
    - new
    - used
  source: "Registry-owned partition of all vehicles by observable facts (registration before the
    supply, use before the supply). Related legal notions, documented but not equal: Directive
    1999/94/EC Art. 2(2) 'new passenger car', Directive 2006/112/EC Art. 2(2)(b) and Art. 311(1)(1).
    The draft tokens pre-registered and demonstrator are withdrawn; prior use is deferred under the
    reserved name vehicle.priorUseCode."
- list: VEHICLE-ODOMETER-STATUS 1.0 (vehicle.odometerReadingStatusCode)
  tokens:
    - displayed
    - replaced
    - rolled-over
    - inoperative
    - unknown
    - other
  source: "Registry-owned issuer statements. Related wording only: Directive 2014/45/EU Annex I item
    7.11 (test-centre findings); informative parallels: ADF odometer status, RDW tellerstandoordeel.
    'manipulated' is reserved for testing bodies and not issued in 1.0."
- list: VEHICLE-ENERGY-SOURCE 1.0 (vehicle.energySourceCode, repeatable)
  tokens:
    - petrol
    - diesel
    - lpg
    - cng
    - lng
    - ethanol
    - biodiesel
    - hydrogen
    - electricity
    - other
  source: "Directive 1999/37/EC code P.3; CoC item 26 ('Diesel/petrol/LPG/NG -
    Biomethane/Ethanol/Biodiesel/Hydrogen') and item 23 (pure electric); Reg. (EU) 2023/1804 Art.
    2(4) for electricity, CNG and LNG. cng and lng include biomethane. Published mapping to IVI 2.0
    EnergySource (after the licence check): petrol 10 (11, 12), ethanol 15 (16), diesel 20,
    biodiesel 21, lpg 30, cng 40 and 44, hydrogen 50, lng 60, electricity 95, other 90 (19, 22, 55,
    91)."
- list: VEHICLE-POWERTRAIN 1.0 (vehicle.powertrainTypeCode)
  tokens:
    - internal-combustion
    - hybrid-electric
    - plug-in-hybrid-electric
    - pure-electric
    - fuel-cell
    - other
  source: "Reg. (EU) 2017/1151 Annex XXI points 3.3.15-3.3.20; CoC items 23 and 23.1. Published
    mapping: hybrid-electric = NOVC-HEV; plug-in-hybrid-electric = OVC-HEV, including range
    extenders; pure-electric = PEV (CoC 23 'pure electric: yes'); fuel-cell = FCV, NOVC-FCHV,
    OVC-FCHV."
- list: VEHICLE-COLOUR 1.0 (vehicle.basicColourCode, repeatable)
  tokens:
    - white
    - yellow
    - orange
    - red
    - violet
    - blue
    - green
    - grey
    - brown
    - black
    - other
  source: Reg. (EU) 2020/683 Annex VIII CoC item 40 footnote 114 ('Indicate only the basic colour(s)';
    DE 'Grundfarben'); Directive 1999/37/EC code R. National register colours outside the ten map
    through the registry's published mapping table.
- list: VEHICLE-STATE-OF-HEALTH-METHOD 1.0 (vehicle.batteryStateOfHealthMethodCode)
  tokens:
    - on-board
    - manufacturer-test
    - independent-test
    - other
  source: Registry-owned. on-board refers to the battery management system data of Reg. (EU) 2023/1542
    Art. 14 and Annex VII Part A (SOCE for electric vehicle batteries) and the on-board monitor of
    UN GTR No. 22.
- list: VEHICLE-EMISSION-LEVEL 1.0 (vehicle.exhaustEmissionLevelCode), grammar not enumeration; examples
  tokens:
    - euro-4
    - euro-5
    - euro-5-plus
    - euro-6b
    - euro-6c
    - euro-6d-temp
    - euro-6d-temp-evap-isc
    - euro-6d
    - euro-6d-isc-fcm
    - euro-6e
    - euro-6e-bis
    - euro-6e-bis-fcm
    - euro-7
    - euro-vi-e
    - stage-v
    - other
  source: CoC item 47 and footnote 116; Reg. (EU) 2017/1151 Annex I Appendix 6 Table 1 'Emission
    standard' names; Reg. (EC) 715/2007; Reg. (EC) 595/2009 (heavy duty, Roman numerals); Reg. (EU)
    168/2013 (L-category, Euro 5+); Reg. (EU) 2024/1257 (Euro 7); Reg. (EU) 2016/1628 (stages).
    Grammar in the key's valueFormat.
