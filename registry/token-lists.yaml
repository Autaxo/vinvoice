- list: EN 16931 country code list (vehicle.registrationCountryCode), external
  tokens:
    - DE
    - AT
    - FR
    - NL
    - IT
    - ES
    - PL
    - GR
    - XI
    - 1A
    - ...
  source: The country code list EN 16931 uses for BT-40 and the other country codes (ISO 3166-1
    alpha-2 plus XI for Northern Ireland and 1A for Kosovo). Greece is GR, not EL. Not the
    distinguishing signs of vehicles.
- list: VEHICLE-CATALOGUE-SCHEME 1.0 (vehicle.catalogueId), open register
  tokens:
    - manufacturer
  source: "Opened with one scheme: 'manufacturer', whose id is the make's own model or sales code for
    the vehicle. Third-party schemes are added only with the catalogue owner's written confirmation,
    each with a licence note; candidates are kept in the non-normative implementation notes
    (NR-16)."
- list: Indicator values (all ...Indicator keys)
  tokens:
    - "true"
    - "false"
  source: NR-08. Lower case only; 'false' is an active statement; an absent row means no statement.
