key: vehicle.role
tier: core
status: draft
labelEn: Vehicle role
labelDe: Fahrzeugbezug
definition: Why the vehicle appears on this line, seen from the seller (BG-4). supply = the vehicle
  is the item supplied (a sale, or a purchase documented by self-billing). trade-in = a vehicle
  taken in from the buyer, shown on an informational line with price 0.00 and no money meaning.
  service = work, parts, inspection or repair on the vehicle. lease / rental = a periodic charge for
  using the vehicle. agency = commission or intermediation for a vehicle. transport = transfer,
  delivery or logistics of the vehicle. other.
valueFormat: one token
grammar: '^(supply|trade-in|service|lease|rental|agency|transport|other)$'
unit: null
codeList: "VEH-ROLE 1.0: supply, trade-in, service, lease, rental, agency, transport, other"
conditionality: MUST on every vehicle line, SHOULD be the second row
statutory: false
repeatable: false
signOff: null
carrier: "BG-32: BT-160 'Fahrzeugbezug [vehicle.role]', BT-161 'supply'"
anchors: No EN 16931 equivalent (BT-3 types the document, not the line).
