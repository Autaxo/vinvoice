key: vehicle.make
tier: core
status: draft
labelEn: Make
labelDe: Marke
definition: Trade name of the manufacturer as in registration field D.1 or CoC item 0.1, without
  model or configuration; not the legal name of the manufacturer (CoC item 0.5).
representationTerm: Name (implicit)
valueFormat: text, NFC, trimmed, no control or bidi characters, first character not = + - @, 1-60 characters
grammar: '^(?![=+@\s-])(?!.*\s$)[^\x00-\x1F\x7F\u200E\u200F\u202A-\u202E\u2066-\u2069]{1,60}$'
unit: null
tokens: []
codeList: none
conditionality: MUST whenever known, all roles
statutory: false
repeatable: false
carrier: "BG-32: BT-160 'Marke [vehicle.make]', BT-161 'Volkswagen'. Factur-X EXTENDED MAY also
  mirror it in ram:BrandName (the row stays)"
anchors: "Directive 1999/37/EC code D.1 'make'; CoC item 0.1 'Make (trade name of manufacturer)';
  informative: CII BrandName, STAR Make, schema.org brand"
