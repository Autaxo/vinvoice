# SPDX-License-Identifier: CC0-1.0

key: vehicle.firstUse
tier: core
status: draft
labelEn: First entry into service
labelDe: Erste Inbetriebnahme
definition: Date the vehicle was first put into service; the 6-month test runs from here. Often the
  first registration date, but earlier if the vehicle was used before registration. This is the
  KoSIT/FeRD row 'Zeitpunkt der ersten Inbetriebnahme'. An absent row carries no meaning; in
  particular it is not a statement that the vehicle was never put into service.
valueFormat: YYYY-MM-DD
grammar: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
unit: null
codeList: none
conditionality: "With vehicle.newMeansOfTransport = true: SHOULD whenever the vehicle was put into
  service before the invoice date, and either this key or an odometer value MUST be present (V-08).
  Otherwise MAY. Whether first registration always counts as first entry into service (UStAE 1b.1)
  is not verified; until it is, issuers state the date they rely on"
statutory: true
repeatable: false
signOff: tax adviser
carrier: "BG-32: BT-160 'Erste Inbetriebnahme [vehicle.firstUse]'. Labelled name mandatory"
anchors: § 1b Abs. 3 Nr. 1, § 14a Abs. 4 UStG; Art. 2(2)(b) Directive 2006/112/EC; FzgLiefgMeldV § 2
  ('if before the invoice date'); HU firstEntryIntoService; PL P_22A; IT DatiVeicoli/Data.
