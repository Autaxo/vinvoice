# SPDX-License-Identifier: CC0-1.0

key: vehicle.vin
tier: core
status: draft
labelEn: Vehicle identification number (VIN)
labelDe: Fahrzeug-Identifizierungsnummer (FIN)
definition: "Identification number marked on the vehicle: the 17-character VIN (ISO 3779; Reg. (EU)
  2021/535 Annex II Part 2). For a vehicle without a VIN, the identifier printed in registration
  field E (for example a chassis or product identification number); receivers treat only a
  17-character value of the expected form as an ISO 3779 VIN. Same value as BT-128 with scheme AKG
  when both are present. A VIN can be personal data when the holder can be identified."
representationTerm: Number (implicit in the listed abbreviation vin)
valueFormat: ^[A-Z0-9]{1,17}$, upper case, no blanks or hyphens; expected form ^[A-HJ-NPR-Z0-9]{17}$
  with a valid position-9 check digit (Reg. (EU) 2021/535 Annex II Part 2); deviations are warnings
  only
grammar: '^[A-Z0-9]{1,17}$'
unit: null
tokens: []
codeList: none
conditionality: MUST on every vehicle line whenever an identifier exists (all roles); may be absent
  only on an order or prepayment invoice before a vehicle is assigned
statutory: false
repeatable: false
carrier: "BG-32: BT-160 'Fahrzeug-Identifizierungsnummer (FIN) [vehicle.vin]', BT-161
  'TSTVEH016N0000001'. Level 2 also BT-128: CII
  ram:SpecifiedLineTradeSettlement/ram:AdditionalReferencedDocument {ram:IssuerAssignedID,
  ram:TypeCode 130, ram:ReferenceTypeCode AKG}; UBL cac:InvoiceLine/cac:DocumentReference {cbc:ID
  schemeID='AKG', cbc:DocumentTypeCode 130}. Optional header BT-18"
anchors: Directive 1999/37/EC Annex I code E; Reg. (EU) 2020/683 Annex VIII CoC item 0.10; Reg. (EU)
  2021/535 Annex II Part 2; ISO 3779; Directive 2014/45/EU Annex II item 1 (DE
  'Fahrzeug-Identifizierungsnummer (FIN oder Fahrgestellnummer)'); UNTDID 1153 AKG for BT-128-1;
  CJEU C-319/22 (VIN as personal data)
