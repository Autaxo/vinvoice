key: vehicle.maximumNetPowerKw
tier: core
status: draft
labelEn: Maximum net power (kW)
labelDe: Höchste Nutzleistung (kW)
definition: "Maximum net power in kilowatts: CoC item 27.1 (internal combustion engine) where the
  vehicle has one; otherwise CoC item 27.3 (electric motors, consolidated for several motors).
  Registration field P.2 normally shows this value; where it shows another quantity, such as the
  maximum 30-minute power of an electric motor (CoC item 27.4), the CoC value is sent. Never a
  combined system power, a 30-minute power or PS/hp."
representationTerm: Measure, unit kW (Rec 20 KWT)
valueFormat: decimal ^(0|[1-9][0-9]{0,3})([.][0-9])?$
grammar: '^(0|[1-9][0-9]{0,3})([.][0-9])?$'
unit: KWT
tokens: []
codeList: "unit fixed: kilowatt (Rec 20 KWT)"
conditionality: MUST whenever known for motor vehicles on supply and trade-in; with
  newMeansOfTransportIndicator = true this key or engineCapacityCm3 SHOULD be present
  (more-than-7.2-kW threshold of Art. 2(2)(a)(i)), and MUST where national law makes it an invoice
  particular (DE)
statutory: false
repeatable: false
carrier: "BG-32: BT-160 'Höchste Nutzleistung (kW) [vehicle.maximumNetPowerKw]', BT-161 '110'"
anchors: "Directive 1999/37/EC code P.2 'maximum net power (in kW) (if available)'; Reg. (EU)
  2020/683 Annex VIII CoC items 27.1, 27.3, 27.4 and footnotes 112 and 159 (DE 'Höchste
  Nutzleistung'); Reg. (EU) 2017/1151 Art. 2 ('net power', 'maximum 30 minutes power'); Directive
  2006/112/EC Art. 2(2)(a)(i) (7.2 kW threshold); national invoice particular: DE UStG §14a(4) with
  §1b(2); HU NAV enginePower; UN/ECE Rec 20 KWT"
