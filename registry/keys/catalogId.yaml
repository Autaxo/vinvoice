key: vehicle.catalogId
tier: optional
status: provisional
labelEn: Catalogue reference
labelDe: Katalog-ID
definition: "Reference into a proprietary vehicle catalogue: identifiers only, never catalogue
  content. Repeatable, one row per scheme."
valueFormat: scheme:id, scheme ^[a-z][a-z0-9-]{1,19}$, id ^[A-Za-z0-9._-]{1,40}$
grammar: '^[a-z][a-z0-9-]{1,19}:[A-Za-z0-9._][A-Za-z0-9._-]{0,39}$'
unit: null
codeList: "VEH-CATALOG-SCHEME (registry, with a licence note per scheme): dat, schwacke, jato, ktype"
conditionality: MAY; only after the catalogue owner has cleared printing identifiers on invoices
statutory: false
repeatable: true
signOff: null
carrier: "BG-32 (repeatable): BT-160 'Katalog-ID [vehicle.catalogId]', BT-161 e.g. 'dat:<id>'"
anchors: DAT €uropa-Code, Schwacke code, JATO ID, TecDoc KType (all proprietary).
