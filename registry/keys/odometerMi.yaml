key: vehicle.odometerMi
tier: core
status: draft
labelEn: Odometer (miles)
labelDe: Kilometerstand (Meilen)
definition: As vehicle.odometerKm, for an instrument that reads in statute miles. Never converted,
  so odometer-integrity checks see what the instrument shows.
valueFormat: integer ^(0|[1-9][0-9]{0,6})$
grammar: '^(0|[1-9][0-9]{0,6})$'
unit: SMI
codeList: "unit fixed: statute mile (Rec 20 SMI)"
conditionality: Used instead of vehicle.odometerKm, never together with it (V-13); same conditions
statutory: true
repeatable: false
signOff: null
carrier: "BG-32: BT-160 'Kilometerstand (Meilen) [vehicle.odometerMi]'. Labelled name mandatory"
anchors: As vehicle.odometerKm (6,000 km = 3,728 statute miles for the § 1b test).
