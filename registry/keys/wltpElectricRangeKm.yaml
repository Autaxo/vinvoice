key: vehicle.wltpElectricRangeKm
tier: optional
status: draft
labelEn: WLTP electric range (km)
labelDe: Elektrische Reichweite WLTP (km)
definition: "Electric range determined under the WLTP (Reg. (EU) 2017/1151 Annex XXI), combined: the
  pure electric range (PER) for pure electric vehicles, the all-electric range (AER) for OVC-HEV.
  Not the equivalent all-electric range (EAER). A type-approval value, not a promise of real-world
  range."
