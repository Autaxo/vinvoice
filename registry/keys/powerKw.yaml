# SPDX-License-Identifier: CC0-1.0

key: vehicle.powerKw
tier: core
status: draft
labelEn: Power (kW)
labelDe: Leistung (kW)
definition: Maximum net power in kilowatts as entered in registration field P.2 (CoC item 27.1). For
  hybrid and electric vehicles use the value the registration document shows, not a marketing system
  power. PS/hp are never sent (display only; 1 PS = 0.73549875 kW).
valueFormat: decimal ^(0|[1-9][0-9]{0,3})([.][0-9])?$
grammar: '^(0|[1-9][0-9]{0,3})([.][0-9])?$'
unit: KWT
codeList: "unit fixed: kilowatt (Rec 20 KWT)"
conditionality: MUST whenever known for motor vehicles on supply and trade-in. With
  vehicle.newMeansOfTransport = true, this key or vehicle.displacementCm3 MUST be present (V-08;
  more than 7.2 kW test, § 1b Abs. 2 Nr. 1 UStG)
statutory: true
repeatable: false
signOff: null
carrier: "BG-32: BT-160 'Leistung (kW) [vehicle.powerKw]', BT-161 '110'. Labelled name mandatory"
anchors: EU registration code P.2 ('if available' in Directive 1999/37/EC per the legislation.gov.uk
  copy; EUR-Lex check pending; the Council compromise on COM(2025) 179 drops the qualifier); CoC
  item 27.1; § 1b Abs. 2 Nr. 1 UStG; KoSIT/FeRD row 'Leistung'; HU enginePower.
