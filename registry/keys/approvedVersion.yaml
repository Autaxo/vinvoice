grammar: '^(?![=+@\s-])(?!.*\s$)[^\x00-\x1F\x7F\u200E\u200F\u202A-\u202E\u2066-\u2069]{1,35}$'
unit: null
tokens: []
codeList: none
conditionality: Same as vehicle.approvedType
statutory: false
repeatable: false
carrier: "BG-32: BT-160 'Version (Typgenehmigung) [vehicle.approvedVersion]', BT-161 'N1'"
anchors: Reg. (EU) 2018/858 Annex I Part B 1.3; Directive 1999/37/EC code D.2; CoC item 0.2; IVI 2.0 Version
