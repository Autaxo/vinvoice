key: vehicle.approvedVersion
tier: optional
status: draft
labelEn: Version (type-approval)
labelDe: Version (Typgenehmigung)
definition: Version designation within the approved variant, as in CoC item 0.2 or registration
  field D.2; same rule for undivided strings as vehicle.approvedType.
representationTerm: Name (implicit)
