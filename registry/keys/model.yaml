# SPDX-License-Identifier: CC0-1.0

key: vehicle.model
tier: core
status: draft
labelEn: Model
labelDe: Modell
definition: Commercial description of the vehicle as printed in registration field D.3 or CoC item
  0.2.1 (for example Golf, or Golf Variant), without the make. Configuration details sent in
  vehicle.configuration SHOULD NOT be repeated here. Not the type-approval type
  (vehicle.approvedType).
representationTerm: Name (implicit)
valueFormat: text, NFC, trimmed, no control or bidi characters, first character not = + - @, 1-60 characters
grammar: '^(?![=+@\s-])(?!.*\s$)[^\x00-\x1F\x7F\u200E\u200F\u202A-\u202E\u2066-\u2069]{1,60}$'
unit: null
tokens: []
codeList: none
conditionality: MUST whenever known, all roles
statutory: false
repeatable: false
carrier: "BG-32: BT-160 'Modell [vehicle.model]', BT-161 'Golf'. Factur-X EXTENDED MAY also mirror
  it in ram:ModelName (the row stays); the full marketing name stays in BT-153"
anchors: "Directive 1999/37/EC code D.3 'commercial description(s)' (DE 'Handelsbezeichnung(en)');
  CoC item 0.2.1 'commercial name(s)'; informative: CII ModelName, schema.org model, COVESA VSS
  Model, STAR Model"
