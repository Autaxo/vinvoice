key: vehicle.batterySohPct
tier: optional
status: provisional
labelEn: Battery state of health (%)
labelDe: Batteriezustand SoH (%)
definition: State of health of the traction battery as a percentage of rated capacity, read from the
  battery management system or a test on the date given in vehicle.batterySohDate.
valueFormat: decimal ^(100([.]0)?|[1-9]?[0-9]([.][0-9])?)$
grammar: '^(100([.]0)?|[1-9]?[0-9]([.][0-9])?)$'
unit: P1
codeList: "unit fixed: percent (Rec 20 P1)"
conditionality: MAY for used battery-electric and plug-in hybrid vehicles; requires vehicle.batterySohDate (V-16)
statutory: false
repeatable: false
signOff: null
carrier: "BG-32: BT-160 'Batteriezustand SoH (%) [vehicle.batterySohPct]'"
anchors: Reg. (EU) 2023/1542 Art. 14 (SoH data in the BMS, read access for the purchaser).
