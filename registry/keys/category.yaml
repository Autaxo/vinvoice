key: vehicle.category
tier: recommended
status: draft
labelEn: EU vehicle category
labelDe: EU-Fahrzeugklasse
definition: "Vehicle category as in registration field J / CoC item 0.4: Reg. (EU) 2018/858 (M1-M3,
  N1-N3, O1-O4, optional suffix G) or Reg. (EU) 168/2013 (L1e-L7e)."
valueFormat: ^((M[1-3]|N[1-3]|O[1-4])G?|L[1-7]e(-[A-Z][0-9]?)?)$ (L sub-categories provisional)
grammar: '^((M[1-3]|N[1-3]|O[1-4])G?|L[1-7]e(-[A-Z][0-9]?)?)$'
unit: null
codeList: Reg. (EU) 2018/858 Art. 4; Reg. (EU) 168/2013
conditionality: SHOULD; especially on invoices to public buyers (same values as KoSIT CVD)
statutory: false
repeatable: false
signOff: null
carrier: "BG-32: BT-160 'EU-Fahrzeugklasse [vehicle.category]', BT-161 'M1'. In a CIUS XRechnung CVD
  invoice the CVD BT-158 'CVD' and the 'cva' row stay; vehicle.category then repeats the CVD class"
anchors: EU registration code J; CoC item 0.4; KoSIT CIUS XRechnung CVD v0.9 (M1, M2, M3, N1, N2, N3).
