key: vehicle.condition
tier: core
status: draft
labelEn: Condition
labelDe: Zustand
definition: Seller's commercial classification at the time of supply. new = never registered and not
  used except for delivery. pre-registered = registered for the dealer or importer without use by an
  end customer (Tageszulassung). demonstrator = used as a demonstration or courtesy vehicle. used =
  all others. Independent of vehicle.newMeansOfTransport (a VAT test) and of the VAT treatment.
valueFormat: one token
grammar: '^(new|pre-registered|demonstrator|used)$'
unit: null
codeList: "VEH-CONDITION 1.0: new, pre-registered, demonstrator, used"
conditionality: MUST for roles supply and trade-in; omit for service, lease and rental
statutory: false
repeatable: false
signOff: null
carrier: "BG-32: BT-160 'Zustand [vehicle.condition]', BT-161 'used'"
anchors: Own definition (no EU legal term).
