statutory: true
repeatable: false
carrier: "BG-32: BT-160 'Meilenstand (mi) [vehicle.odometerReadingMi]', BT-161 '30000'. Labelled
  name mandatory (statutory feature)"
anchors: As odometerReadingKm; Reg. (EU) 2020/683 Annex VIII (CoC statement whether the odometer has
  metric or imperial units); UN/ECE Rec 20 SMI
