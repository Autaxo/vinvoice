unit: null
tokens: []
codeList: "EU bodywork codes: Reg. (EU) 2018/858 Annex I Part C and Appendix 2"
conditionality: MAY; useful for vans, trucks, buses and trailers
statutory: false
repeatable: false
carrier: "BG-32: BT-160 'Code des Aufbaus [vehicle.bodyworkCode]', BT-161 'AA'"
anchors: Reg. (EU) 2018/858 Annex I Part C and Appendix 2, Part A point 5; CoC item 38 'Code for
  bodywork' (DE 'Code des Aufbaus'); COM(2025) 179 code J.1 (proposal)
