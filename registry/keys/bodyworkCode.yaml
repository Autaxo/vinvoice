key: vehicle.bodyworkCode
tier: optional
status: draft
labelEn: Code for bodywork
labelDe: Code des Aufbaus
definition: "EU code for bodywork (CoC item 38): AA-AG passenger cars, BA-BE and BX goods vehicles,
  CA-CJ and CX buses, DA, DB, DC and DE trailers, SA-SH and SJ special purpose vehicles; with two
  supplementary digits where Appendix 2 applies."
