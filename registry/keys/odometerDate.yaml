key: vehicle.odometerDate
tier: recommended
status: draft
labelEn: Odometer reading date
labelDe: Kilometerstand am
definition: "Date the odometer reading was taken, when it differs from the reference date (BT-72
  actual delivery date, else BT-2). Typical cases: workshop intake, trade-in appraisal."
valueFormat: YYYY-MM-DD
grammar: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
unit: null
codeList: none
conditionality: SHOULD whenever the reading date differs from the reference date; SHOULD on service lines
statutory: false
repeatable: false
signOff: null
carrier: "BG-32: BT-160 'Kilometerstand am [vehicle.odometerDate]'"
anchors: COM(2025) 180 Art. 4a (proposal only).
