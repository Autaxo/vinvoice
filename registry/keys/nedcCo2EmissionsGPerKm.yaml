unit: null
tokens: []
codeList: "unit fixed: g/km (no Rec 20 code, so never given as BT-212; BT-212 per the XRechnung 4.0.0 pre-release, section 3.23, to be confirmed against DIN EN 16931-1:2026); test procedure fixed: NEDC"
conditionality: MAY; only for vehicles whose CoC or registration document gives an NEDC value
statutory: false
repeatable: false
carrier: "BG-32: BT-160 'CO2-Emissionen NEFZ (g/km) [vehicle.nedcCo2EmissionsGPerKm]', BT-161 '128'"
anchors: Directive 1999/37/EC code V.7; Reg. (EU) 2020/683 Annex VIII CoC item 49 (NEDC block; DE
