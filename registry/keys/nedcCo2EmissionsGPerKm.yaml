key: vehicle.nedcCo2EmissionsGPerKm
tier: optional
status: draft
labelEn: NEDC CO2 emissions (g/km)
labelDe: CO2-Emissionen NEFZ (g/km)
definition: "CO2 emissions in g/km determined under the NEDC (UN Regulation No 101), including NEDC
  values obtained by correlation from WLTP results, as printed in CoC item 49 or registration field
  V.7: the combined value, or the weighted combined value for OVC-HEV. A type-approval value, not
  real-world emissions."
representationTerm: Measure, unit g/km (no Rec 20 code)
valueFormat: integer ^(0|[1-9][0-9]{0,3})$
